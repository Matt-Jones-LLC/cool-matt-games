name: Check site

# Runs on every pull request: links and anchors resolve, pages carry their metadata,
# and the generated pages match what the _build scripts produce.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Links, anchors and metadata
        run: python3 _build/check.py
      - name: Generated pages are up to date
        run: |
          python3 _build/meta.py
          python3 _build/build.py
          git diff --exit-code
